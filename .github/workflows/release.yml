name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Tag must match the manifest version
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' herdr-plugin.toml | head -1)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != manifest $want"; exit 1; }

      - run: go test -count=1 ./...

      - name: Cross-compile
        run: |
          set -eu
          mkdir -p dist
          ldflags="-s -w -X github.com/ellingtonsp/herdr-orch/internal/daemon.Version=$GITHUB_REF_NAME"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            for bin in herdr-orch horch; do
              out="${bin}-${os}-${arch}"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "dist/$out" "./cmd/$bin"
              ( cd dist && sha256sum "$out" | awk '{print $1}' > "$out.sha256" )
            done
          done
          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
